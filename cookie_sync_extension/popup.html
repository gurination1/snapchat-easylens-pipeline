<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Snapchat Session Sync</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 300px;
      padding: 16px;
      margin: 0;
      background: #0f1117;
      color: #e5e7eb;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 8px;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      text-align: center;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn:disabled {
      background: #374151;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
      word-break: break-all;
    }
    .success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #34d399;
    }
    .error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #f87171;
    }
    .info {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid #3b82f6;
      color: #60a5fa;
    }
  </style>
</head>
<body>
  <h2>⚡ Snapchat Auto-Sync</h2>
  <p>Captures your persistent Snapchat session cookie (valid up to 1 year) and syncs it directly to GitHub Actions.</p>
  <button id="syncBtn" class="btn">Sync Session to GitHub</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
