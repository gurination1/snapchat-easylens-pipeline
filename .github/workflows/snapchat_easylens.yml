name: Snapchat EasyLens Autonomous Agent Pipeline

on:
  schedule:
    # Autonomous fleet pacing: runs every 4 hours at minute 27 (avoids :00 queue congestion)
    # resolve_target_account.py enforces 6.5h cooldown per account & selects longest idle
    - cron: '27 */4 * * *'
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Account Persona (auto: Fair Rotation, 1: Beasts, 2: Cyber/Optics, 3: Meme, 4: Luxury 35mm, 5: Surreal)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      use_gemini:
        description: 'Use Gemini Autonomous Prompt Architect'
        type: boolean
        default: true
      custom_instructions:
        description: 'Optional custom instructions for Gemini'
        required: false
        default: ''
      auto_publish:
        description: 'Publish lens if 100% verified'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run-autonomous-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve Target Account & Enforce Fleet Pacing
        id: pacing
        env:
          TARGET_ACC: ${{ inputs.account_id }}
        run: |
          python resolve_target_account.py
          if [ "$SHOULD_RUN" = "false" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Fleet pacing optimal. Both accounts within cooldown window. Skipping scheduled run."
            echo "skip_run=true" >> $GITHUB_OUTPUT
          else
            echo "skip_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        if: steps.pacing.outputs.skip_run != 'true'
        run: |
          echo "=== [1/3] INSTALLING SYSTEM & PYTHON PACKAGES & PLAYWRIGHT BROWSERS ==="
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests pillow playwright playwright-stealth cryptography numpy opencv-python-headless
          playwright install --with-deps chromium

      - name: Setup Cloudflare WARP Tunnel
        if: steps.pacing.outputs.skip_run != 'true'
        run: |
          echo "=== [2/3] CONFIGURING OFFICIAL CLOUDFLARE WARP TUNNEL ==="
          sudo apt-get update -y
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends cloudflare-warp
          sudo warp-cli --accept-tos registration new || true
          sudo warp-cli --accept-tos mode warp+doh || true
          sudo warp-cli --accept-tos connect || true

          echo "=== [3/3] VERIFYING CLOUDFLARE WARP EGRESS & SNAPCHAT CONNECTIVITY ==="
          WARP_CONNECTED=false
          for i in $(seq 1 12); do
            TRACE=$(curl -s --max-time 4 https://www.cloudflare.com/cdn-cgi/trace || true)
            if echo "$TRACE" | grep -q "warp="; then
              echo "Cloudflare WARP successfully connected (attempt $i):"
              echo "$TRACE" | grep -E "warp|ip|loc"
              WARP_CONNECTED=true
              break
            fi
            echo "Waiting for WARP routing (attempt $i/12)..."
            sleep 1
          done

          echo "Testing DNS and HTTP reachability to Snapchat accounts:"
          getent hosts accounts.snapchat.com || true
          curl -sI --max-time 10 https://accounts.snapchat.com/v2/login > /tmp/snap_headers.txt 2>&1 || true
          head -n 5 /tmp/snap_headers.txt || true

      - name: Execute Autonomous Lens Pipeline & Verifier
        if: steps.pacing.outputs.skip_run != 'true'
        env:
          SNAP_SSO_TOKEN: ${{ secrets.SNAP_SSO_TOKEN }}
          SNAP_COOKIE_HEADER: ${{ secrets.SNAP_COOKIE_HEADER }}
          SNAP_ACCOUNTS_COOKIE: ${{ secrets.SNAP_ACCOUNTS_COOKIE }}
          SNAP_USERNAME: ${{ secrets.SNAP_USERNAME }}
          SNAP_PASSWORD: ${{ secrets.SNAP_PASSWORD }}
          SNAP_USERNAME_ACC_2: ${{ secrets.SNAP_USERNAME_ACC_2 }}
          SNAP_PASSWORD_ACC_2: ${{ secrets.SNAP_PASSWORD_ACC_2 }}
          SNAP_SSO_TOKEN_ACC_2: ${{ secrets.SNAP_SSO_TOKEN_ACC_2 }}
          SNAP_COOKIE_HEADER_ACC_2: ${{ secrets.SNAP_COOKIE_HEADER_ACC_2 }}
          SNAP_ACCOUNTS_COOKIE_ACC_2: ${{ secrets.SNAP_ACCOUNTS_COOKIE_ACC_2 }}
          SNAP_USERNAME_ACC_3: ${{ secrets.SNAP_USERNAME_ACC_3 }}
          SNAP_PASSWORD_ACC_3: ${{ secrets.SNAP_PASSWORD_ACC_3 }}
          SNAP_SSO_TOKEN_ACC_3: ${{ secrets.SNAP_SSO_TOKEN_ACC_3 }}
          SNAP_COOKIE_HEADER_ACC_3: ${{ secrets.SNAP_COOKIE_HEADER_ACC_3 }}
          SNAP_ACCOUNTS_COOKIE_ACC_3: ${{ secrets.SNAP_ACCOUNTS_COOKIE_ACC_3 }}
          SNAP_USERNAME_ACC_4: ${{ secrets.SNAP_USERNAME_ACC_4 }}
          SNAP_PASSWORD_ACC_4: ${{ secrets.SNAP_PASSWORD_ACC_4 }}
          SNAP_SSO_TOKEN_ACC_4: ${{ secrets.SNAP_SSO_TOKEN_ACC_4 }}
          SNAP_COOKIE_HEADER_ACC_4: ${{ secrets.SNAP_COOKIE_HEADER_ACC_4 }}
          SNAP_ACCOUNTS_COOKIE_ACC_4: ${{ secrets.SNAP_ACCOUNTS_COOKIE_ACC_4 }}
          SNAP_USERNAME_ACC_5: ${{ secrets.SNAP_USERNAME_ACC_5 }}
          SNAP_PASSWORD_ACC_5: ${{ secrets.SNAP_PASSWORD_ACC_5 }}
          SNAP_SSO_TOKEN_ACC_5: ${{ secrets.SNAP_SSO_TOKEN_ACC_5 }}
          SNAP_COOKIE_HEADER_ACC_5: ${{ secrets.SNAP_COOKIE_HEADER_ACC_5 }}
          SNAP_ACCOUNTS_COOKIE_ACC_5: ${{ secrets.SNAP_ACCOUNTS_COOKIE_ACC_5 }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS || 'gurination1@gmail.com' }}
          GMAIL_ADDRESS_ACC_2: ${{ secrets.GMAIL_ADDRESS_ACC_2 }}
          GMAIL_APP_PASSWORD_ACC_2: ${{ secrets.GMAIL_APP_PASSWORD_ACC_2 }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TARGET_ACC: ${{ inputs.account_id }}
          USE_GEMINI: ${{ github.event_name == 'schedule' || inputs.use_gemini != false }}
          CUSTOM_INSTRUCTIONS: ${{ inputs.custom_instructions || '' }}
          AUTO_PUBLISH: ${{ github.event_name == 'schedule' || inputs.auto_publish != false }}
          PYTHONUNBUFFERED: "1"
        run: |
          export ACCOUNT_ID="${TARGET_ACCOUNT:-1}"
          echo "=== EXECUTING PIPELINE FOR TARGET ACCOUNT #$ACCOUNT_ID ==="
          echo "=== RUNNING PRE-FLIGHT ZERO-DEFECT QUALITY GATES ==="
          python run_tests.py
          echo "=== PRE-FLIGHT VERIFICATION PASSED: LAUNCHING PIPELINE ==="
          python -u pipeline_runner.py

      - name: Disconnect WARP Tunnel
        if: always() && steps.pacing.outputs.skip_run != 'true'
        run: |
          sudo warp-cli --accept-tos disconnect 2>/dev/null || sudo wg-quick down wg0 2>/dev/null || true

      - name: Upload Lens Verification & Artifacts
        if: always() && steps.pacing.outputs.skip_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snapchat-lens-verified-data
          path: |
            verification_report.json
            gemini_generation_plan.json
            generated_lens_metadata.json
            publish_status.json
            *.png
            *.mp4

      - name: Commit Pipeline State (Deduplication History)
        if: always() && steps.pacing.outputs.skip_run != 'true'
        run: |
          export GIT_TERMINAL_PROMPT=0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published_lenses.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update published lenses history [skip ci]"
          git pull --rebase origin main 2>/dev/null || true
          git push origin main 2>/dev/null || true
