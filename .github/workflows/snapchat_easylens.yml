name: Snapchat EasyLens Autonomous Agent Pipeline

on:
  schedule:
    # Autonomous 2 lenses per day: 08:00 UTC and 20:00 UTC
    - cron: '0 8,20 * * *'
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Account Persona (1: Beasts, 2: Dance, 3: Meme, 4: Luxury 35mm, 5: Surreal)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      use_gemini:
        description: 'Use Gemini Autonomous Prompt Architect'
        type: boolean
        default: true
      custom_instructions:
        description: 'Optional custom instructions for Gemini'
        required: false
        default: ''
      auto_publish:
        description: 'Publish lens if 100% verified'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run-autonomous-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests pillow

      - name: Execute Autonomous Lens Pipeline & Verifier
        env:
          SNAP_SSO_TOKEN: ${{ secrets.SNAP_SSO_TOKEN }}
          SNAP_COOKIE_HEADER: ${{ secrets.SNAP_COOKIE_HEADER }}
          SNAP_ACCOUNTS_COOKIE: ${{ secrets.SNAP_ACCOUNTS_COOKIE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TARGET_ACC: ${{ inputs.account_id }}
          USE_GEMINI: ${{ inputs.use_gemini != false }}
          CUSTOM_INSTRUCTIONS: ${{ inputs.custom_instructions || '' }}
          AUTO_PUBLISH: ${{ inputs.auto_publish != false }}
        run: |
          if [ -n "$TARGET_ACC" ]; then
            export ACCOUNT_ID="$TARGET_ACC"
          else
            # Scheduled cron: dynamically cycle across accounts 1 to 5
            DAY=$(date -u +%j)
            HOUR=$(date -u +%H)
            SLOT=$(( (10#$DAY * 2 + 10#$HOUR / 12) % 5 + 1 ))
            echo "Cron triggered: Auto-assigned Account Persona #$SLOT"
            export ACCOUNT_ID="$SLOT"
          fi
          python pipeline_runner.py

      - name: Upload Lens Verification & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapchat-lens-verified-data
          path: |
            verification_report.json
            gemini_generation_plan.json
            generated_lens_metadata.json
            publish_status.json
            preview_neutral_simulated.png
            preview_mouth_open_simulated.png

      - name: Commit Pipeline State (Deduplication History)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published_lenses.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update published lenses history [skip ci]"
          git pull --rebase origin main 2>/dev/null || true
          git push origin main 2>/dev/null || true
