name: Snapchat Fleet Autonomous Cloud Watchdog

on:
  workflow_dispatch:
  schedule:
    # Staggered every 30 minutes at minutes 5 and 35
    - cron: '5,35 * * * *'

permissions:
  contents: write
  actions: write

jobs:
  audit-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Fleet Watchdog & Auto-Dispatch Missed Accounts
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 snapchat_fleet_watchdog.py
